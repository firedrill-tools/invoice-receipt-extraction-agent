name: Check
on:
  push:
  pull_request:
jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --dev
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync extract-document --help
      - run: uv run --no-sync extract-document --list-cases
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix firedrill --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix firedrill
      - run: uv build --wheel
      - run: uv run --no-sync python scripts/check_wheel.py
